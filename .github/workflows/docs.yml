name: Docs

# The documentation builds without warnings. Read the Docs publishes it; this
# only checks that a change does not break the build.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'python/FlightRadarAPI/__init__.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'python/FlightRadarAPI/__init__.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Warnings (including broken cross-references, via -n) fail the build, the
  # same as on Read the Docs.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build docs
        run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
